<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Pocket Mechanic</title>
    <meta name="description" content="Fix broken treasures from the inside out." />
    <meta name="theme-color" content="#344f4b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #342f29;
        background-image: radial-gradient(ellipse at center, #554638 0%, #342f29 78%);
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none; /* no pull-to-refresh / bounce stealing drags */
        -webkit-touch-callout: none; /* no long-press callout on iOS */
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* Phones held upright: ask to turn sideways (the game is landscape). */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #e9dcc0;
        background-image:
          radial-gradient(ellipse at 22% 16%, rgba(160, 164, 119, 0.22), transparent 42%),
          radial-gradient(ellipse at 85% 92%, rgba(183, 123, 86, 0.18), transparent 48%);
        color: #342f29;
        font: bold 26px Georgia, "Times New Roman", serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        box-shadow: inset 0 0 0 9px #79503d, inset 0 0 0 12px #b77b56, inset 0 0 0 16px #537a72;
      }
      #rotate .phone {
        font-size: 72px;
        filter: sepia(0.5) saturate(0.45);
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      #rotate .ok {
        margin-top: 10px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: #a0a477;
        color: #342f29;
        border: 5px solid #79503d;
        font-size: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 0 rgba(52, 47, 41, 0.3), inset 0 0 0 2px #d3a278;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      /* tapped away: play upright (rotation lock on, or a tablet on a stand) */
      body.rotate-ok #rotate { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone">📱</div><div>Turn me sideways!</div><div class="ok" aria-label="Play">▶</div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
