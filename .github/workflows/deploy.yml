# Pages currently publishes main /docs. The committed docs/play build is the
# release; this workflow validates it without racing a second Pages deployment.
name: Validate game and Pages build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - run: npm run check:pages
      - run: git diff --exit-code -- docs/play
